<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}{{robots}}<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F3EDE2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191816" media="(prefers-color-scheme: dark)">
<meta name="author" content="Pablo Chiaro Rosa">
<meta property="og:type" content="{{og_type}}">
<meta property="og:site_name" content="CCT">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:locale" content="{{og_locale}}">
<meta property="og:image" content="{{site_url}}/img/social-preview.png">
<meta property="og:image:width" content="1280">
<meta property="og:image:height" content="640">
<meta property="og:image:alt" content="CCT: Claude Code and Codex usage and account switcher on the Windows taskbar">
<meta name="twitter:card" content="summary_large_image">
{{verification}}<link rel="icon" href="{{root}}favicon.svg" type="image/svg+xml">
<link rel="alternate" type="application/atom+xml" title="CCT releases" href="{{repo_url}}/releases.atom">
<link rel="sitemap" type="application/xml" href="{{root}}sitemap.xml">
<style>
{{css}}</style>
<script type="application/ld+json">{{jsonld}}</script>
<script type="speculationrules">{"prefetch":[{"where":{"href_matches":"{{root}}*"},"eagerness":"moderate"}]}</script>
</head>
<body>
<a class="skip" href="#main">{{skip}}</a>
<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="{{root}}" aria-label="CCT home">
      <svg aria-hidden="true" width="28" height="28" viewBox="0 0 32 32"><rect width="32" height="32" fill="currentColor"/><rect x="6" y="9" width="4" height="14" fill="#D97757"/><rect x="13" y="14" width="4" height="9" fill="#3B82F6"/><rect x="20" y="17" width="6" height="6" fill="#4CC2FF"/></svg>
      <span>CCT</span>
    </a>
    <nav aria-label="{{nav_label}}">
      <ul>
        {{nav}}
      </ul>
    </nav>
    <div class="header-actions">
      <a class="lang" href="{{lang_href}}" hreflang="{{lang_other}}" lang="{{lang_other}}">{{lang_name}}</a>
      <a class="btn small" href="{{repo_url}}"><span aria-hidden="true">★</span> {{star}} {{star_count}}</a>
    </div>
  </div>
</header>
<main id="main">
{{body}}</main>
<footer class="site-footer">
  <div class="wrap">
    <p>{{made}} <a href="https://github.com/chiarorosa">Pablo Chiaro Rosa</a> · <a href="{{repo_url}}">{{source}}</a> · <a href="{{root}}changelog/">Changelog</a> · <a href="{{repo_url}}/blob/main/SECURITY.md">Security</a> · <a href="{{root}}llms.txt">llms.txt</a></p>
    <p class="muted">{{footer}}</p>
  </div>
</footer>
</body>
</html>

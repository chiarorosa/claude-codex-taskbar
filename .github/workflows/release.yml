name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Sign build provenance with Sigstore and store it on GitHub (issue #19).
  id-token: write
  attestations: write
  # Start the website build once the release is out (pages.yml).
  actions: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Check binary size
        shell: pwsh
        run: |
          # README promises a single .exe under 1 MB (issue #18).
          $limit = 1000000
          $size = (Get-Item target/release/claude-codex-taskbar.exe).Length
          $line = "claude-codex-taskbar.exe: $size bytes (limit $limit, headroom $($limit - $size))"
          Write-Output $line
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content $env:GITHUB_STEP_SUMMARY $line }
          if ($size -gt $limit) {
            Write-Output "::error::claude-codex-taskbar.exe is $size bytes, over the $limit-byte budget"
            exit 1
          }
      - name: Package
        shell: pwsh
        run: |
          $name = "claude-codex-taskbar-${{ github.ref_name }}-x64"
          New-Item -ItemType Directory -Force dist, $name | Out-Null
          Copy-Item target/release/claude-codex-taskbar.exe dist/claude-codex-taskbar.exe
          Copy-Item target/release/claude-codex-taskbar.exe, README.md, LICENSE, CHANGELOG.md $name
          Compress-Archive -Path "$name/*" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            # LF line endings so `sha256sum -c SHA256SUMS.txt` works everywhere.
            [IO.File]::AppendAllText("$PWD/dist/SHA256SUMS.txt", "$hash  $($_.Name)`n")
          }
          Get-Content dist/SHA256SUMS.txt
      - name: MSIX package for the Microsoft Store
        shell: pwsh
        env:
          # Partner Center → the app → Product identity. Until they are set (repository
          # variables), the package carries the local test identity and is not for the Store.
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}
        run: |
          $identity = @{}
          if ($env:MSIX_IDENTITY_NAME) { $identity.IdentityName = $env:MSIX_IDENTITY_NAME }
          if ($env:MSIX_PUBLISHER) { $identity.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_DISPLAY_NAME) { $identity.PublisherDisplayName = $env:MSIX_PUBLISHER_DISPLAY_NAME }
          ./packaging/build-msix.ps1 @identity
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/claude-codex-taskbar.exe
            dist/*.zip
            dist-msix/*.msix
          # Nothing is pushed to a registry, so no storage record and no extra permission.
          create-storage-record: false
      - name: Keep the MSIX for the Store submission
        # Unsigned (the Store signs it), so it is a workflow artifact, not a release download.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-${{ github.ref_name }}
          path: dist-msix/*.msix
          if-no-files-found: error
          retention-days: 90
      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/claude-codex-taskbar.exe
            dist/SHA256SUMS.txt
      - name: Refresh the website
        # Releases made with GITHUB_TOKEN do not trigger other workflows, so start it by hand.
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo ${{ github.repository }}

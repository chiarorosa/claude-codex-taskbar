name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Check binary size
        shell: pwsh
        run: |
          # README promises a single .exe under 1 MB (issue #18).
          $limit = 1000000
          $size = (Get-Item target/release/claude-codex-taskbar.exe).Length
          $line = "claude-codex-taskbar.exe: $size bytes (limit $limit, headroom $($limit - $size))"
          Write-Output $line
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content $env:GITHUB_STEP_SUMMARY $line }
          if ($size -gt $limit) {
            Write-Output "::error::claude-codex-taskbar.exe is $size bytes, over the $limit-byte budget"
            exit 1
          }
      - name: MSIX package (pack, sign with a throwaway certificate, install, launch, remove)
        shell: pwsh
        run: |
          # The runner is thrown away, so the test certificate and the install never outlive it.
          ./packaging/build-msix.ps1 -Sign
          $msix = Get-ChildItem dist-msix -Filter *.msix | Select-Object -First 1
          Import-Certificate -FilePath dist-msix/CCT-LocalTest.cer -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null
          Add-AppxPackage -Path $msix.FullName
          $pkg = Get-AppxPackage -Name CCT.LocalTest
          if (-not $pkg) { throw "the MSIX package did not install" }
          $line = "MSIX: $($msix.Name), $($msix.Length) bytes, installed as $($pkg.PackageFullName)"
          Write-Output $line
          if ($env:GITHUB_STEP_SUMMARY) { Add-Content $env:GITHUB_STEP_SUMMARY $line }
          Start-Process "shell:AppsFolder\$($pkg.PackageFamilyName)!CCT"
          Start-Sleep -Seconds 5
          $proc = Get-Process claude-codex-taskbar -ErrorAction SilentlyContinue |
            Where-Object { $_.Path -like "*\WindowsApps\*" }
          if ($proc) {
            Write-Output "packaged app is running from $($proc[0].Path)"
            $proc | Stop-Process -Force
          } else {
            # The runner has no interactive taskbar, so the app may legitimately not stay up.
            Write-Output "::warning::the packaged app was not running 5 s after launch on the runner"
          }
          Remove-AppxPackage -Package $pkg.PackageFullName

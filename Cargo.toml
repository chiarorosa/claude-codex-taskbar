[package]
name = "claude-codex-taskbar"
version = "0.4.0"
edition = "2024"
description = "CCT: Windows 10/11 taskbar widget showing Claude Code / Codex usage limits and CPU, RAM, GPU, disk usage"
license = "MIT"
readme = "README.md"
publish = false

[lib]
name = "claude_codex_taskbar"
path = "src/lib.rs"

[[bin]]
name = "claude-codex-taskbar"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dependencies.windows]
version = "0.62.2"
features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_Globalization", "Win32_Networking_WinHttp", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Console", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Time", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"]

[build-dependencies]
embed-resource = "3.0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
